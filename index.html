<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadow Strike - 3D Shooter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <div id="crosshair">
      <div class="ch-dot"></div>
      <div class="ch-line ch-top"></div>
      <div class="ch-line ch-bottom"></div>
      <div class="ch-line ch-left"></div>
      <div class="ch-line ch-right"></div>
    </div>

    <div id="hud">
      <div class="hud-row">
        <div class="hud-block">
          <div class="hud-label">HEALTH</div>
          <div class="hud-bar"><div id="health-fill" class="hud-bar-fill health"></div></div>
        </div>
        <div class="hud-block">
          <div class="hud-label">AMMO</div>
          <div id="ammo" class="hud-value">30 / 90</div>
        </div>
        <div class="hud-block">
          <div class="hud-label">SCORE</div>
          <div id="score" class="hud-value">0</div>
        </div>
        <div class="hud-block">
          <div class="hud-label">WAVE</div>
          <div id="wave" class="hud-value">1</div>
        </div>
      </div>
    </div>

    <div id="damage-flash"></div>

    <div id="overlay" class="overlay">
      <div class="overlay-card">
        <h1>SHADOW STRIKE</h1>
        <p class="subtitle">Ein 3D-Shooter mit dynamischen Schatten</p>
        <ul class="controls">
          <li><b>WASD</b> &mdash; Bewegen</li>
          <li><b>Maus</b> &mdash; Umsehen</li>
          <li><b>Linksklick</b> &mdash; Schie&szlig;en</li>
          <li><b>Leertaste</b> &mdash; Springen</li>
          <li><b>Shift</b> &mdash; Sprinten</li>
          <li><b>R</b> &mdash; Nachladen</li>
          <li><b>ESC</b> &mdash; Pause</li>
        </ul>
        <button id="start-btn">SPIEL STARTEN</button>
      </div>
    </div>

    <div id="game-over" class="overlay hidden">
      <div class="overlay-card">
        <h1 id="end-title">GAME OVER</h1>
        <p>Score: <span id="final-score">0</span></p>
        <p>Wave erreicht: <span id="final-wave">1</span></p>
        <button id="restart-btn">NEU STARTEN</button>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
